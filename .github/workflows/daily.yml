name: Kantor AI Shorts

on:
  schedule:
    - cron: "0 23 * * *"   # 23.00 UTC = 07.00 WITA
  workflow_dispatch:
    inputs:
      upload:
        description: "1 = upload ke YouTube, 0 = hanya buat video (uji coba)"
        default: "0"

permissions:
  contents: write

jobs:
  produksi:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pasang FFmpeg dan font
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Pasang library
        run: pip install -r requirements.txt

      - name: Jalankan kantor AI
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY: private   # ubah ke public setelah Anda yakin hasilnya bagus
          UPLOAD: ${{ github.event.inputs.upload || '1' }}
        run: python main.py

      - name: Simpan video untuk diperiksa
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-hasil
          path: work/final.mp4
          retention-days: 3
          if-no-files-found: ignore

      - name: Tandai topik selesai
        run: |
          git config user.name "kantor-ai"
          git config user.email "kantor-ai@users.noreply.github.com"
          git add topics.csv
          git diff --cached --quiet || (git commit -m "tandai topik selesai" && git push)
